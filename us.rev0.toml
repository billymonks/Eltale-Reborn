# Config file for Quest 64 Recompilation

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
# elf_path = "quest64.elf"
rom_file_path = "quest64.us.z64"
symbols_file_path = "Quest64Syms/dump.toml"
output_func_path = "RecompiledFuncs"

[patches]
stubs = [
    "func_800471B0", #some libleo function
    "func_8004793C", #another libleo function
    "initPFSPaks", #is this ever actually called??
    "func_8003C530",
]

ignored = [
    "__osBlockSum",
    "__osPfsReleasePages",
    "__osPfsDeclearPage",
]

[[patches.hook]]
func = "func_80024690"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024690

[[patches.hook]]
func = "dma_write"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024260

# Rumble follows a sound effect as it actually starts. Delay 0 plays here ($a0 the id,
# $a3 the scaled volume). A delayed effect waits in func_80026658 and starts with $a0 the id.
[[patches.hook]]
func = "func_800268D4"
text = "void recomp_sfx_rumble(unsigned char* rdram, int id, int volume); recomp_sfx_rumble(rdram, (int)(ctx->r4 & 255), (int)(ctx->r7 & 255));"
before_vram = 0x80026940

[[patches.hook]]
func = "func_80026658"
text = "void recomp_sfx_rumble(unsigned char* rdram, int id, int volume); recomp_sfx_rumble(rdram, (int)(ctx->r4 & 255), (int)(ctx->r5 & 255));"
before_vram = 0x80026790